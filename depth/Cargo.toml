[package]
name = "snowhush-depth"
version = "0.1.0"
edition = "2024"
publish = false
description = "Depth Anything V2 Small on the CPU, for reading a wallpaper's depth on Windows and Linux"

[dependencies]
snowhush-core = { path = "../core" }
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
half = "2"

[profile.release]
lto = true
codegen-units = 1

[build-dependencies]
candle-core = "=0.9.1"
half = "2"
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"

# gemm, under candle, assembles its half-precision kernels on 64-bit ARM Linux only when optimized, and the build script
# packing the depth network's weights runs it unoptimized by default.
[profile.dev.package.gemm-f16]
opt-level = 3

[profile.release.package.gemm-f16]
opt-level = 3
