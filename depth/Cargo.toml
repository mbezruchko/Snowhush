[package]
name = "snowhush-depth"
version = "0.1.0"
edition = "2024"
publish = false
description = "Depth Anything V2 Small on the CPU, for reading a wallpaper's depth on Windows and Linux"

[dependencies]
snowhush-core = { path = "../core" }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
half = "2"
sha2 = { version = "0.10", default-features = false }

[[bin]]
name = "pack"
path = "src/bin/pack.rs"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
