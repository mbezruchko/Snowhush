name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: |
          cargo fmt --check --manifest-path core/Cargo.toml
          cargo fmt --check --manifest-path windows/Cargo.toml
          cargo fmt --check --manifest-path linux/Cargo.toml
      - name: Tests
        run: cargo test --locked --manifest-path core/Cargo.toml

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release --bin Snowhush --manifest-path windows/Cargo.toml

  linux:
    name: Linux app
    # An older glibc than ubuntu-latest has, so the binary it leaves runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libwayland-dev
      - run: cargo build --locked --release --manifest-path linux/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: snowhush-linux-x86_64
          path: linux/target/release/snowhush

  mac:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
