name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: |
          cargo fmt --check --manifest-path core/Cargo.toml
          cargo fmt --check --manifest-path windows/Cargo.toml
      - name: Tests
        run: cargo test --locked --manifest-path core/Cargo.toml

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release --bin Snowhush --manifest-path windows/Cargo.toml

  mac:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
