[package]
name = "snowhush-net"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1.0.104"
data-encoding = "2.11.1"
iroh = { version = "1.4.1", default-features = false, features = ["portmapper", "tls-ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }

# Built for size: what goes between players is a few bytes a throw.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The build's own proc-macros and scripts are loaded by the compiler: stripped, newer macOS refuses to load them
# ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = "none"

