[package]
name = "snowhush-kde"
version = "0.5.6"
edition = "2024"
publish = false

[[bin]]
name = "snowhush"
path = "src/main.rs"

[dependencies]
snowhush = { path = "../windows" }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
glow = "0.18"
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
